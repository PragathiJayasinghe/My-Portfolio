<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1418"/>
      <stop offset="50%" stop-color="#141a1f"/>
      <stop offset="100%" stop-color="#1f2830"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20b2a6"/>
      <stop offset="100%" stop-color="#26c4b8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242b32" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#141a1f" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#242b32" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="225" r="180" fill="#20b2a6" opacity="0.08" filter="blur(40px)"/>

  <!-- Dashboard Mockup Card -->
  <rect x="120" y="70" width="560" height="310" rx="16" fill="url(#cardGrad)" stroke="#242b32" stroke-width="2"/>
  
  <!-- Window Header -->
  <circle cx="150" cy="95" r="5" fill="#ff5f56"/>
  <circle cx="165" cy="95" r="5" fill="#ffbd2e"/>
  <circle cx="180" cy="95" r="5" fill="#27c93f"/>
  <rect x="220" y="88" width="160" height="14" rx="7" fill="#1f2830"/>

  <!-- Chart visual -->
  <rect x="150" y="130" width="150" height="80" rx="8" fill="#1a2329" stroke="#242b32"/>
  <text x="165" y="155" fill="#7a8491" font-family="Inter, sans-serif" font-size="12" font-weight="600">TOTAL REVENUE</text>
  <text x="165" y="185" fill="#20b2a6" font-family="Inter, sans-serif" font-size="20" font-weight="700">$128,450</text>

  <rect x="320" y="130" width="150" height="80" rx="8" fill="#1a2329" stroke="#242b32"/>
  <text x="335" y="155" fill="#7a8491" font-family="Inter, sans-serif" font-size="12" font-weight="600">ACTIVE USERS</text>
  <text x="335" y="185" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="700">24.5k</text>

  <rect x="490" y="130" width="160" height="80" rx="8" fill="#1a2329" stroke="#242b32"/>
  <text x="505" y="155" fill="#7a8491" font-family="Inter, sans-serif" font-size="12" font-weight="600">GROWTH</text>
  <text x="505" y="185" fill="#26c4b8" font-family="Inter, sans-serif" font-size="20" font-weight="700">+34.8%</text>

  <!-- Big Graph Area -->
  <rect x="150" y="230" width="500" height="130" rx="8" fill="#1a2329" stroke="#242b32"/>
  <path d="M 170 330 Q 240 290 310 310 T 450 260 T 580 270 T 630 245" fill="none" stroke="url(#tealGrad)" stroke-width="3"/>
  <path d="M 170 330 Q 240 290 310 310 T 450 260 T 580 270 T 630 245 L 630 350 L 170 350 Z" fill="url(#tealGrad)" opacity="0.15"/>
</svg>
