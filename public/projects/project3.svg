<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1418"/>
      <stop offset="50%" stop-color="#141a28"/>
      <stop offset="100%" stop-color="#141a1f"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <circle cx="400" cy="225" r="180" fill="#8b5cf6" opacity="0.08" filter="blur(40px)"/>

  <!-- AI Assistant Chat UI Mockup -->
  <rect x="120" y="70" width="560" height="310" rx="16" fill="#141a1f" stroke="#242b32" stroke-width="2"/>
  <circle cx="150" cy="95" r="5" fill="#ff5f56"/>
  <circle cx="165" cy="95" r="5" fill="#ffbd2e"/>
  <circle cx="180" cy="95" r="5" fill="#27c93f"/>
  <rect x="220" y="88" width="160" height="14" rx="7" fill="#1f2830"/>

  <!-- AI Prompt and Bubble -->
  <rect x="150" y="130" width="380" height="60" rx="12" fill="#1f2830" stroke="#242b32"/>
  <text x="170" y="165" fill="#f0f2f5" font-family="Inter, sans-serif" font-size="14">Draft a technical overview for our API architecture.</text>

  <!-- AI Response Bubble -->
  <rect x="200" y="205" width="450" height="100" rx="12" fill="#1a2329" stroke="#8b5cf6" stroke-opacity="0.4"/>
  <text x="220" y="235" fill="#8b5cf6" font-family="Inter, sans-serif" font-size="13" font-weight="600">✦ GPT-4 Assistant</text>
  <rect x="220" y="250" width="380" height="10" rx="4" fill="#7a8491" opacity="0.6"/>
  <rect x="220" y="268" width="340" height="10" rx="4" fill="#7a8491" opacity="0.6"/>
  <rect x="220" y="286" width="220" height="10" rx="4" fill="#7a8491" opacity="0.6"/>

  <!-- Input Field -->
  <rect x="150" y="325" width="500" height="40" rx="20" fill="#1f2830" stroke="#242b32"/>
  <text x="175" y="350" fill="#7a8491" font-family="Inter, sans-serif" font-size="13">Ask anything or type a prompt...</text>
</svg>
